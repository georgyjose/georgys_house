# Publish the site to GitHub Pages.
#
# BEFORE THE FIRST RUN: Settings -> Pages -> Source must be set to
# "GitHub Actions" by hand. A workflow cannot turn Pages on for you —
# GITHUB_TOKEN has no admin scope, so asking configure-pages to create the
# site fails with "Resource not accessible by integration".
#
# You only need this file if the source is "GitHub Actions". If it is set to
# "Deploy from a branch" instead, this workflow is unnecessary — delete it.
# The site has no build step, so a branch deploy works just as well.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a run finish rather than cancelling it mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # no `enablement: true` — GITHUB_TOKEN cannot create a Pages site.
      # Set Settings -> Pages -> Source to "GitHub Actions" once, by hand.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # v4+ drops dotfiles by default, and .nojekyll is a dotfile
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
