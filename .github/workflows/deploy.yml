# Publish the site to GitHub Pages.
#
# You only need this file if Settings -> Pages -> Source is set to
# "GitHub Actions". If it is set to "Deploy from a branch" instead, this
# workflow is unnecessary — delete it. The site has no build step, so a
# branch deploy works just as well and has nothing to keep up to date.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a run finish rather than cancelling it mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5
        with:
          # turns Pages on for the repo if it is not already, instead of
          # failing with "Get Pages site failed ... Not Found"
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # v4+ drops dotfiles by default, and .nojekyll is a dotfile
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
